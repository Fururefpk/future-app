<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Future Property Holdings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#f5f7fa,#e0e7ff);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#0a1628}
        .card{background:#fff;border-radius:16px;padding:60px 48px;text-align:center;max-width:480px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.08)}
        .icon{font-size:64px;margin-bottom:24px}
        h1{font-family:'Playfair Display',serif;font-size:32px;margin-bottom:12px}
        p{color:#666;line-height:1.7;margin-bottom:28px}
        a{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#2563eb,#1e40af);color:#fff;border-radius:8px;text-decoration:none;font-weight:600;transition:transform .2s}
        a:hover{transform:translateY(-2px)}
        .code{font-size:80px;font-family:'Playfair Display',serif;color:#e0e7ff;margin-bottom:4px}
    </style>
</head>
<body>
    <div class="card">
        <div class="code">404</div>
        <div class="icon">🏚️</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. Let's get you back home.</p>
        <a href="/">Back to Future Property Holdings</a>
    </div>
</body>
</html>
